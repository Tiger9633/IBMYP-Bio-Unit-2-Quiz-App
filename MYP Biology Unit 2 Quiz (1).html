<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MYP Biology Unit 2 Quiz</title>
<style>
:root{--bg:#f3f6f1;--card:#fff;--ink:#17261d;--mute:#5d6e63;--line:#cfdacf;--acc:#1f6b4a;--accT:#fff;--ok:#1f7a45;--okB:#dff3e5;--no:#b3261e;--noB:#fbe3e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a14;--card:#18261e;--ink:#e6f0e8;--mute:#9db0a3;--line:#2d4236;--acc:#6fcf9f;--accT:#0c1a12;--ok:#7be0a4;--okB:#1b3a28;--no:#ff9c94;--noB:#412220}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,"Times New Roman",serif;padding:20px}
main{max-width:680px;margin:0 auto}
h1{font:700 30px/1.15 Georgia,serif;margin:8px 0 6px}
.sub{color:var(--mute);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
button,select,textarea,input{font:inherit;color:var(--ink)}
.opt,.btn{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:11px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.btn{display:inline-block;width:auto;text-align:center;background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:700;margin:12px 8px 0 0}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt.ok{background:var(--okB);border-color:var(--ok)}.opt.no{background:var(--noB);border-color:var(--no)}
input[type=text],textarea,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}
textarea{min-height:90px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .25s}
.meta{color:var(--mute);font-size:15px;display:flex;justify-content:space-between}
.fb{margin-top:12px;padding:10px 14px;border-radius:8px}.fb.ok{background:var(--okB)}.fb.no{background:var(--noB)}
.big{font-size:52px;font-weight:700;margin:4px 0}
li{margin:6px 0}label{display:block;margin:14px 0 6px;font-weight:700}
</style></head><body><main id="app"></main>
<script>
var S=[
["Part 1: Chemistry, carbon and polymers",[
["m","Which six elements make up about 96% of the mass of living organisms?",["C, H, O, N, P, S","C, H, O, Na, K, Cl","C, O, N, Fe, Mg, Ca","H, O, N, P, Ca, Fe"],0],
["m","Why is carbon considered tetravalent?",["It has 2 valence electrons","It has 4 valence electrons and forms 4 covalent bonds","It forms ionic bonds with 4 metals","It dissolves in 4 solvents"],1],
["m","Which reaction links monomers together by removing a water molecule?",["Hydrolysis","Dehydration synthesis (condensation)","Oxidation-reduction","Neutralization"],1],
["m","Which process breaks polymers into monomers by adding water?",["Dehydration synthesis","Hydrolysis","Polymerization","Esterification"],1],
["f","A single repeating building block used to assemble a polymer is a ___.","monomer","monomer"],
["f","Joining many monomers covalently into a long chain is called ___.","polymerization","polymerization"],
["s","Compare dehydration synthesis and hydrolysis in terms of water involvement and bond formation or breaking.","Dehydration synthesis forms covalent bonds between monomers by removing a water molecule (anabolic). Hydrolysis breaks covalent bonds in polymers by consuming a water molecule (catabolic)."],
["m","Which functional group is a nitrogen bonded to two hydrogens (-NH2)?",["Carboxyl","Amino","Hydroxyl","Phosphate"],1],
["m","Which functional group gives fatty acids their acidic properties?",["Hydroxyl (-OH)","Carboxyl (-COOH)","Methyl (-CH3)","Carbonyl (C=O)"],1],
["f","Organic molecules have carbon and hydrogen backbones, whereas ___ molecules generally do not contain both C and H.","inorganic","inorganic"],
["s","Explain why carbon’s ability to form single, double and ring bonds makes it uniquely suited for life.","Carbon’s 4 valence electrons let it form up to 4 stable covalent bonds in linear, branched or ringed carbon skeletons."],
["m","In a condensation reaction between two monomers, what is the primary byproduct?",["Carbon dioxide (CO2)","Water (H2O)","Oxygen gas (O2)","Hydrogen peroxide (H2O2)"],1],
["f","Enzymes that break down food polymers during digestion carry out ___ reactions.","hydrolysis|hydrolytic","hydrolysis"],
["m","Which of these is an inorganic molecule?",["Glucose","Water","Fatty acid","Amino acid"],1],
["m","Which functional group is -OH?",["Carboxyl","Amino","Hydroxyl","Phosphate"],2],
["m","Which functional group is found in ATP and the backbone of DNA?",["Phosphate","Amino","Hydroxyl","Methyl"],0],
["f","Reactions that build large molecules from small ones are called ___ reactions.","anabolic","anabolic"],
["f","Reactions that break large molecules down into smaller ones are called ___ reactions.","catabolic","catabolic"],
["m","Which is NOT one of the four major classes of biological macromolecules?",["Carbohydrates","Salts","Proteins","Nucleic acids"],1],
["m","How many covalent bonds does each carbon atom usually form?",["1","2","3","4"],3],
["s","Explain why large biological molecules are built from small repeating monomers.","A small set of monomers can be joined in many sequences to make a huge variety of polymers, and the same enzymes and reactions can be reused to build them."]]],
["Part 2: Carbohydrates",[
["m","What is the monomer of carbohydrates?",["Fatty acid","Amino acid","Monosaccharide","Nucleotide"],2],
["m","What C:H:O ratio is typical for simple monosaccharides like glucose (C6H12O6)?",["1:1:1","1:2:1","2:1:2","1:3:1"],1],
["m","Which bond links monosaccharides into disaccharides or polysaccharides?",["Peptide bond","Ester bond","Glycosidic bond","Phosphodiester bond"],2],
["m","Which polysaccharide is the main energy store in plants?",["Glycogen","Cellulose","Starch","Chitin"],2],
["m","Where do animals mainly store glycogen?",["Plant cell walls","Liver and muscle tissues","Adipose fat cells","Blood plasma"],1],
["m","Why is cellulose indigestible to humans while starch is easily digested?",["Cellulose contains nitrogen","Starch has alpha-glycosidic bonds; cellulose has beta-1,4-glycosidic bonds","Cellulose is a monomer; starch is a polymer","Starch is non-polar"],1],
["f","Glucose has the molecular formula ___.","c6h12o6","C6H12O6"],
["f","Sucrose is a disaccharide of glucose and ___, joined by dehydration synthesis.","fructose","fructose"],
["f","Lactose (milk sugar) is glucose bonded to ___.","galactose","galactose"],
["s","Differentiate monosaccharides, disaccharides and polysaccharides, with one example of each.","Monosaccharides are single sugar units (glucose). Disaccharides are two linked sugars (sucrose). Polysaccharides are long sugar chains (starch, glycogen)."],
["s","Explain why extensive branching in glycogen lets animal cells mobilize glucose rapidly during intense activity.","Branching provides many terminal ends where enzymes such as glycogen phosphorylase can cleave glucose units at the same time."],
["m","Which polysaccharide gives rigid support in fungal cell walls and insect exoskeletons?",["Starch","Chitin","Glycogen","Maltose"],1],
["m","Maltose is formed by condensation of which two monosaccharides?",["Glucose + Fructose","Glucose + Glucose","Glucose + Galactose","Ribose + Deoxyribose"],1],
["f","In water, hexose sugars like glucose fold from linear chains into stable ___ structures.","ring|cyclic|pyranose","ring"],
["m","Which of these is a monosaccharide?",["Sucrose","Fructose","Starch","Maltose"],1],
["m","Which polysaccharide is made of beta-glucose and forms plant cell walls?",["Starch","Glycogen","Cellulose","Chitin"],2],
["m","Which two monosaccharides make sucrose?",["Glucose + Glucose","Glucose + Fructose","Glucose + Galactose","Fructose + Galactose"],1],
["f","The branched form of starch is ___ (the unbranched form is amylose).","amylopectin","amylopectin"],
["f","Glucose and fructose are isomers: they share C6H12O6 but have a different ___.","structure|structures|arrangement|shape","structure (arrangement of atoms)"],
["m","What is the main role of glucose in cells?",["Energy source for respiration","Storing genetic information","Forming membranes","Speeding up reactions"],0],
["f","Plants store glucose as starch, while animals store it as ___.","glycogen","glycogen"],
["m","Which of these is a disaccharide?",["Glucose","Lactose","Cellulose","Glycogen"],1],
["s","Explain why cellulose is important in the human diet even though humans cannot digest it.","It acts as dietary fiber, adding bulk that helps food move through the gut and keeps the digestive system healthy."]]],
["Part 3: Lipids",[
["m","What property unifies all lipids?",["Soluble in water","Non-polar and hydrophobic","Made only from amino acids","1:2:1 C:H:O ratio"],1],
["m","A triglyceride is built from:",["1 glycerol + 3 fatty acids","3 glycerols + 1 fatty acid","1 amino acid + 3 glucose rings","1 phosphate + 2 nucleosides"],0],
["m","Which bond joins fatty acids to glycerol?",["Peptide bond","Ester linkage","Glycosidic bond","Hydrogen bond"],1],
["m","Why are saturated fats usually solid at room temperature while unsaturated fats are oils?",["Saturated fats have double bonds that cause kinks","Saturated fats have straight chains that pack tightly","Unsaturated fats have higher melting points","Saturated fats dissolve in water"],1],
["m","Which lipid is amphipathic and forms the core of cell membranes?",["Triglyceride","Phospholipid","Cholesterol","Beeswax"],1],
["f","A fatty acid with one or more C=C double bonds is ___.","unsaturated","unsaturated"],
["f","The backbone of steroids has ___ fused carbon rings.","four|4","four (4)"],
["s","Explain how the amphipathic nature of phospholipids makes them assemble into a bilayer in water.","Hydrophilic polar heads face outward toward the watery fluids, while hydrophobic non-polar tails point inward toward each other, shielded from water."],
["m","Gram for gram, how does the energy in lipids compare to carbohydrates?",["Less than carbohydrates","More than double (~37 kJ/g vs ~17 kJ/g)","Identical","Only when heated"],1],
["f","In a phospholipid, the phosphate head is hydrophilic, whereas the two fatty acid tails are ___.","hydrophobic|non-polar|nonpolar","hydrophobic"],
["s","What role does cholesterol play in animal cell plasma membranes?","It sits in the bilayer and regulates membrane fluidity and mechanical stability across temperature changes."],
["m","Which type of fat has no C=C double bonds in its fatty acid chains?",["Saturated","Unsaturated","Polyunsaturated","Monounsaturated"],0],
["m","Which lipid is mainly used for long-term energy storage in animals?",["Phospholipids","Triglycerides (fats)","Steroids","Waxes"],1],
["m","Which of these is a steroid hormone?",["Insulin","Testosterone","Amylase","Collagen"],1],
["f","Fat is stored in specialized cells called ___ cells.","adipose|fat","adipose"],
["f","The water-loving head of a phospholipid is described as ___.","hydrophilic|polar","hydrophilic"],
["m","Why can’t lipids dissolve in water?",["They are non-polar, while water is polar","They are too small","They contain nitrogen","They are acids"],0],
["s","Explain how double bonds change the shape and melting point of a fatty acid.","A double bond puts a kink in the chain, so unsaturated fatty acids cannot pack tightly. This gives them a lower melting point, so they are liquid oils at room temperature."],
["m","Besides energy storage, which is a function of lipids?",["Insulation and protecting organs","Carrying the genetic code","Catalyzing reactions","Forming cellulose walls"],0]]],
["Part 4: Proteins and enzymes",[
["m","What is the monomer of proteins?",["Monosaccharide","Fatty acid","Amino acid","Nucleotide"],2],
["m","How many standard amino acids do cells use to build proteins?",["4","12","20","64"],2],
["m","Which bond links the carboxyl group of one amino acid to the amino group of the next?",["Glycosidic bond","Peptide bond","Ester linkage","Hydrogen bond"],1],
["m","Primary structure of a protein is:",["Local alpha-helices and beta-sheets","The linear sequence of amino acids","The 3D shape of a folded polypeptide","The assembly of multiple subunits"],1],
["m","What stabilizes secondary structures like alpha-helices and beta-pleated sheets?",["Peptide bonds","Hydrogen bonds along the backbone","Disulfide bridges between R-groups","Hydrophobic interactions"],1],
["m","Tertiary structure is determined mainly by interactions between:",["Peptide backbone atoms","R-group side chains","Neighboring cell membranes","Nitrogenous base pairs"],1],
["m","Hemoglobin, with four polypeptide subunits, is an example of which level of structure?",["Primary","Secondary","Tertiary","Quaternary"],3],
["f","Loss of a protein’s 3D shape from heat or extreme pH, without breaking peptide bonds, is called ___.","denaturation|denatured|denaturing","denaturation"],
["f","Biological catalysts made of globular proteins that lower activation energy are called ___.","enzymes|enzyme","enzymes"],
["s","Explain how the induced fit model describes the enzyme and substrate interaction.","Substrate binding causes a subtle change in the active site’s shape, which fits tightly around the substrate to help catalysis."],
["s","Why does extreme heat cause irreversible enzyme denaturation?","Heat energy disrupts the hydrogen and ionic bonds that hold the 3D shape, distorting the active site so substrates can no longer bind."],
["m","Which is a fibrous structural protein giving tensile strength to skin and tendons?",["Insulin","Amylase","Collagen","Hemoglobin"],2],
["m","In sickle-cell anemia, hydrophilic glutamic acid is replaced by hydrophobic valine at position 6. Why does this cause sickling?",["Valine dissolves the membrane","Valine forms a sticky hydrophobic patch so hemoglobin polymerizes into rigid fibers","Valine breaks peptide bonds","Valine prevents DNA replication"],1],
["f","Covalent bonds between cysteine R-groups in tertiary structure are called ___ bridges.","disulfide|disulphide","disulfide"],
["m","What do the R-groups of amino acids determine?",["The number of peptide bonds","Each amino acid’s unique chemical properties","The type of sugar","The DNA base sequence"],1],
["m","A chain of many amino acids is called a:",["Polysaccharide","Polypeptide","Triglyceride","Nucleotide"],1],
["m","Which level of protein structure includes the alpha-helix?",["Primary","Secondary","Tertiary","Quaternary"],1],
["m","What happens to an enzyme at very low temperatures?",["It denatures permanently","Reaction rate slows because molecules move slower","It speeds up","It becomes a substrate"],1],
["m","The substance an enzyme acts on is called the:",["Product","Substrate","Cofactor","Inhibitor"],1],
["f","The region of an enzyme where the substrate binds is the ___ site.","active","active"],
["m","Pepsin works best in the stomach at about which pH?",["pH 2","pH 7","pH 9","pH 12"],0],
["m","As substrate concentration rises (with enzyme amount fixed), the reaction rate:",["Rises, then levels off once active sites are full","Falls steadily","Stays at zero","Denatures the enzyme"],0],
["s","Explain why each enzyme is specific to one substrate.","The enzyme’s active site has a particular 3D shape that is complementary to its substrate, so only that substrate fits and binds."]]],
["Part 5: Nucleic acids and water",[
["m","What is the monomer of DNA and RNA?",["Amino acid","Nucleotide","Monosaccharide","Fatty acid"],1],
["m","Which three components form a nucleotide?",["Glycerol, fatty acid, phosphate","Pentose sugar, phosphate group, nitrogenous base","Amino acid, carboxyl, R-group","Glucose, fructose, water"],1],
["m","How do DNA and RNA differ in sugar and bases?",["DNA: ribose and uracil; RNA: deoxyribose and thymine","DNA: deoxyribose and thymine; RNA: ribose and uracil","Both contain deoxyribose","DNA is single-stranded; RNA is double-stranded"],1],
["m","Why is water a polar molecule?",["Electrons are shared equally","Oxygen is more electronegative, giving partial negative (O) and partial positive (H) charges","It contains ionic bonds","It has a pH of 14"],1],
["m","Which force lets water molecules stick together (cohesion) and gives high surface tension?",["Covalent bond","Ionic bond","Hydrogen bond","Peptide bond"],2],
["f","Water sticking to other polar surfaces, such as xylem vessels, is called ___.","adhesion","adhesion"],
["f","A solution of pH 3 has a higher concentration of ___ ions than pH 7.","hydrogen|h+|h3o+|hydronium","hydrogen (H+)"],
["s","Explain why water’s high specific heat capacity is vital for organisms and aquatic ecosystems.","Water absorbs or releases large amounts of heat with little temperature change, stabilizing body temperature and protecting aquatic habitats from sudden swings."],
["f","In DNA, A pairs with T by 2 hydrogen bonds and C pairs with G by ___ hydrogen bonds.","three|3","three (3)"],
["s","Differentiate a strong acid (HCl) from a weak acid (CH3COOH) in terms of dissociation.","Strong acids dissociate fully into ions in water; weak acids dissociate only partially, in a reversible equilibrium."],
["m","Which modified nucleotide is the main cellular energy currency?",["DNA","RNA","ATP","Glucose"],2],
["m","Which base is found in RNA but not in DNA?",["Thymine","Uracil","Cytosine","Guanine"],1],
["m","What is the shape of DNA?",["Single helix","Double helix","Flat sheet","Ring"],1],
["f","In DNA, adenine pairs with ___.","thymine","thymine"],
["m","Which bonds hold the two DNA strands together?",["Peptide bonds","Hydrogen bonds","Ionic bonds","Glycosidic bonds"],1],
["m","Why can some insects walk on water?",["High surface tension from cohesion","Low density of insects only","Water is acidic","Water evaporates quickly"],0],
["m","Why does ice float on liquid water?",["Hydrogen bonds hold the molecules farther apart, making ice less dense","Ice is heavier","Ice contains only air","Ice is non-polar"],0],
["m","A solution with pH 7 is:",["Acidic","Neutral","Basic","Strongly acidic"],1],
["s","Explain why water is called the universal solvent in cells.","Water’s polar molecules surround and separate ions and other polar substances, dissolving them so reactions can occur in cytoplasm and substances can be transported in blood."]]],
["Part 6: Food tests and lab practical",[
["m","Which reagent tests for reducing sugars like glucose?",["Iodine solution","Benedict’s reagent","Biuret reagent","Ethanol"],1],
["m","Which step does Benedict’s test need that iodine and Biuret tests do not?",["Shaking with ethanol","Heating in a hot water bath (80-100°C) for 3-5 minutes","Freezing in ice","Adding strong acid"],1],
["m","A positive iodine test for starch changes from amber/yellow to:",["Brick-red","Violet/purple","Dark blue-black","Milky white"],2],
["m","Which color change is a positive Biuret test for protein?",["Blue to brick-red","Blue to violet/purple","Yellow to dark blue-black","Clear to cloudy"],1],
["m","How is a positive ethanol emulsion test for lipids seen?",["Brick-red precipitate","A cloudy white milky emulsion when added to water","Solution turns purple","Paper turns black"],1],
["f","In a food test, distilled water is tested through every step as a ___ control.","negative","negative"],
["f","DCPIP turns from deep blue to colorless in the presence of vitamin C (___ acid).","ascorbic","ascorbic"],
["s","Explain why non-reducing sucrose gives a negative (blue) Benedict’s result unless first hydrolyzed.","Sucrose’s glycosidic bond locks both carbonyl groups. Acid hydrolysis splits it into free glucose and fructose, which have active reducing carbonyls."],
["m","A student tests egg white with Biuret reagent. What do they observe and why?",["Blue-black due to starch","Violet/purple due to peptide bonds in egg albumin protein","Brick-red precipitate","Clear solution"],1],
["f","In the grease spot test, a positive result leaves a translucent spot on brown paper that persists after ___.","drying|dry|evaporation","drying"],
["s","Describe how Benedict’s test gives semi-quantitative data on reducing sugar concentration.","The color runs blue, green (low), yellow, orange, then brick-red precipitate (high), which matches rising reducing sugar concentration."],
["m","Which reagent tests for starch?",["Iodine solution","Benedict’s reagent","Biuret reagent","Ethanol"],0],
["m","Which reagent tests for protein?",["Iodine solution","Benedict’s reagent","Biuret reagent","DCPIP"],2],
["m","What color is Benedict’s reagent before heating with a reducing sugar?",["Blue","Red","Yellow","Purple"],0],
["m","What is the result of iodine solution on a food with no starch?",["Stays amber/yellow-brown","Blue-black","Brick-red","Purple"],0],
["f","A high concentration of reducing sugar gives a ___ precipitate in Benedict’s test.","brick-red|brickred|red","brick-red"],
["m","Why should safety goggles be worn during Benedict’s test?",["Hot solutions and reagents can splash","The test gives off bright light","The reagent is radioactive","They improve color vision"],0],
["m","Which test uses DCPIP?",["Vitamin C","Starch","Protein","Lipids"],0],
["f","The Biuret test turns violet because of ___ bonds in proteins.","peptide","peptide"],
["s","A student’s Benedict’s test stays blue. What can they conclude, and what is one limitation?","No reducing sugar was detected. A limitation is that the food could still contain a non-reducing sugar such as sucrose, which needs hydrolysis first."]]]
];
var app=document.getElementById("app"),Q,i,score,missed,done;
function sh(a){a=a.slice();for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[k];a[k]=t}return a}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function home(){
var o='<option value="all">All parts (125 questions)</option>';
S.forEach(function(s,n){o+='<option value="'+n+'">'+esc(s[0])+" ("+s[1].length+")</option>"});
app.innerHTML='<h1>Unit 2 Biology Quiz</h1><p class="sub">9th Grade IB MYP: organic chemistry, macromolecules, water and food tests. 125 questions drawn from the review pack plus new practice questions.</p><div class="card"><label for="sec">Choose a section</label><select id="sec">'+o+'</select><label><input type="checkbox" id="shuf" checked> Shuffle question order</label><button class="btn" id="go">Start quiz</button></div>';
document.getElementById("go").onclick=function(){
var v=document.getElementById("sec").value;
Q=[];S.forEach(function(s,n){if(v=="all"||v==n)s[1].forEach(function(q){Q.push(q)})});
if(document.getElementById("shuf").checked)Q=sh(Q);
i=0;score=0;missed=[];show()}}
function show(){
if(i>=Q.length)return end();
var q=Q[i],h='<div class="meta"><span>Question '+(i+1)+" of "+Q.length+'</span><span>Score '+score+'</span></div><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><div class="card"><p style="margin-top:0"><b>'+esc(q[1])+"</b></p>";
if(q[0]=="m"){h+='<div id="opts">';q[2].forEach(function(t,n){h+='<button class="opt" data-n="'+n+'">'+String.fromCharCode(65+n)+") "+esc(t)+"</button>"});h+="</div>"}
else if(q[0]=="f")h+='<input type="text" id="ans" aria-label="Your answer" autocomplete="off"><button class="btn" id="chk">Check answer</button>';
else h+='<textarea id="ans" aria-label="Your answer"></textarea><button class="btn" id="chk">Show model answer</button>';
h+='<div id="fb"></div></div>';app.innerHTML=h;
if(q[0]=="m")document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pickM(+b.dataset.n)}});
else{var a=document.getElementById("ans");if(q[0]=="f")a.addEventListener("keydown",function(e){if(e.key=="Enter")document.getElementById("chk").click()});document.getElementById("chk").onclick=function(){q[0]=="f"?chkF():chkS()}}}
function fin(ok,msg){
if(ok)score++;else missed.push(Q[i]);
var f=document.getElementById("fb");f.className="fb "+(ok?"ok":"no");f.innerHTML=msg+'<br><button class="btn" id="nx" style="margin-bottom:0">'+(i+1>=Q.length?"See results":"Next question")+"</button>";
var b=document.getElementById("nx");b.onclick=function(){i++;show()};b.focus()}
function pickM(n){var q=Q[i],ok=n==q[3];
document.querySelectorAll(".opt").forEach(function(b,k){b.disabled=true;if(k==q[3])b.classList.add("ok");else if(k==n)b.classList.add("no")});
fin(ok,ok?"Correct.":"Not quite. The answer is "+String.fromCharCode(65+q[3])+") "+esc(q[2][q[3]])+".")}
function chkF(){var q=Q[i],a=document.getElementById("ans"),v=a.value.trim().toLowerCase().replace(/\s+/g,""),ok=q[2].split("|").indexOf(v)>-1;
a.disabled=true;document.getElementById("chk").style.display="none";
fin(ok,ok?"Correct.":"Not quite. The answer is <b>"+esc(q[3])+"</b>.")}
function chkS(){var q=Q[i];document.getElementById("ans").disabled=true;document.getElementById("chk").style.display="none";
var f=document.getElementById("fb");f.className="fb";f.innerHTML="<b>Model answer:</b> "+esc(q[2])+"<p>Did your answer cover this?</p>";
var y=document.createElement("button"),n=document.createElement("button");y.className="btn";n.className="btn alt";y.textContent="Yes, I got it";n.textContent="Not yet";
y.onclick=function(){fin(true,"Marked correct.")};n.onclick=function(){fin(false,"Marked for review.")};f.appendChild(y);f.appendChild(n);y.focus()}
function end(){
var p=Math.round(score/Q.length*100),h='<h1>Results</h1><div class="card"><div class="big">'+score+" / "+Q.length+'</div><p>'+p+"% correct.</p>";
if(missed.length){h+="<b>Review these:</b><ul>";missed.forEach(function(q){h+="<li>"+esc(q[1])+"<br><small>Answer: "+esc(q[0]=="m"?q[2][q[3]]:q[0]=="f"?q[3]:q[2])+"</small></li>"});h+="</ul>"}
else h+="<p>No misses. Full marks.</p>";
h+='<button class="btn" id="re">Try again</button>';
if(missed.length)h+='<button class="btn alt" id="mm">Retry missed questions</button>';
app.innerHTML=h+"</div>";
document.getElementById("re").onclick=home;
if(missed.length)document.getElementById("mm").onclick=function(){Q=sh(missed);i=0;score=0;missed=[];show()}}
home();
</script></body></html>
